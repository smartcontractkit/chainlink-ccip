name: Upload CCIP Integration Test Result
description: Validate one integration test result artifact and upload it to Trunk

inputs:
  result-directory:
    description: Directory containing test-results.xml, test-outcome.txt, and test-job-url.txt
    required: true
  trunk-token:
    description: Trunk API token
    required: true
  artifact-name:
    description: Name for the uploaded test logs
    required: true

runs:
  using: composite
  steps:
    - name: Read test outcome
      id: test-results
      shell: bash
      env:
        RESULTS_DIR: ${{ inputs.result-directory }}
      run: |
        set -euo pipefail
        outcome="$(cat "$RESULTS_DIR/test-outcome.txt")"
        if [[ "$outcome" != "success" && "$outcome" != "failure" ]]; then
          echo "::error::Invalid test outcome in result artifact."
          exit 1
        fi
        test_job_url="$(cat "$RESULTS_DIR/test-job-url.txt")"
        expected_job_url_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/"
        test_job_url_suffix="${test_job_url#"$expected_job_url_prefix"}"
        if [[ "$test_job_url" != "$expected_job_url_prefix"* || ! "$test_job_url_suffix" =~ ^[0-9]+/attempts/[0-9]+$ ]]; then
          echo "::error::Invalid test job URL in result artifact."
          exit 1
        fi
        if [[ ! -f "$RESULTS_DIR/test-results.xml" ]]; then
          echo "::error::Missing JUnit report in result artifact."
          exit 1
        fi
        echo "outcome=$outcome" | tee -a "$GITHUB_OUTPUT"
        echo "test-job-url=$test_job_url" | tee -a "$GITHUB_OUTPUT"

    - name: Analyze and upload test results
      uses: smartcontractkit/.github/actions/branch-out-upload@branch-out-upload/v1
      with:
        junit-file-path: ${{ inputs.result-directory }}/test-results.xml
        trunk-org-slug: chainlink
        trunk-previous-step-outcome: ${{ steps.test-results.outputs.outcome }}
        trunk-token: ${{ inputs.trunk-token }}
        trunk-job-url: ${{ steps.test-results.outputs.test-job-url }}
        artifact-name: ${{ inputs.artifact-name }}
