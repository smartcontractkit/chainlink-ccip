name: 'Build CL Node Image'
description: 'Build Chainlink node image with plugins'

inputs:
  ton_ref:
    description: 'Git ref (branch) of the TON relayer'
    required: false
  solana_ref:
    description: 'Git ref (branch) of the Solana relayer'
    required: false
  ccip_ref:
    description: 'Git ref (branch) of the CCIP repo'
    required: false
  chainlink_version:
    description: 'Chainlink version to use (e.g., develop, gh ref, etc.)'
    default: 'develop'
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout Chainlink repository
      uses: actions/checkout@v5
      with:
        repository: smartcontractkit/chainlink
        ref: ${{ inputs.chainlink_version }}
        path: chainlink-repo

    - name: Setup path to go.mod
      id: go-mod
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        echo "path=${WORKSPACE}/chainlink-repo/go.mod" | tee -a "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v6 # v6
      with:
        go-version-file: ${{ steps.go-mod.outputs.path }}
        cache: true

    - name: Download Go modules
      working-directory: ${{ github.workspace }}/chainlink-repo
      shell: bash
      run: go mod download
    
    - name: Upgrade relayer dependencies to specified commit
      working-directory: ${{ github.workspace }}/chainlink-repo
      shell: bash
      env:
        TON_REF: ${{ inputs.ton_ref }}
        SOLANA_REF: ${{ inputs.solana_ref }}
        CCIP_REF: ${{ inputs.ccip_ref }}
      run: |
        export GOPRIVATE=github.com/smartcontractkit/*
        # Drop any stale shallow-clone VCS cache that the Go module cache restore may have
        # left behind.
        rm -rf "$(go env GOMODCACHE)/cache/vcs" || true
        if [ -n "$TON_REF" ]; then
          for i in 1 2 3; do
            go get "github.com/smartcontractkit/chainlink-ton@${TON_REF}" && break
            echo "retry $i - unshallow race on chainlink-ton, sleeping 5s"
            sleep 5
          done
        fi
        if [ -n "$SOLANA_REF" ]; then
          go get "github.com/smartcontractkit/chainlink-solana@${SOLANA_REF}"
        fi
        if [ -n "$CCIP_REF" ]; then
          go get "github.com/smartcontractkit/chainlink-ccip@${CCIP_REF}"
          go get "github.com/smartcontractkit/chainlink-ccip/chains/evm@${CCIP_REF}"
        fi
        make gomodtidy
