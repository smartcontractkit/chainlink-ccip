name: "Run CCIP OCR3 Integration Test"

on:
  pull_request:
    branches-ignore:
      - "develop"
  merge_group:
    branches-ignore:
      - "develop"
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e_should_run: ${{ steps.changes.outputs.e2e_should_run }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          list-files: "shell"
          # Run on all, except the chains/evm folder unless it's in a released version.
          filters: |
            e2e_should_run:
              - '!(chains/evm/**)'
              - 'chains/evm/gobindings/generated/!(latest/**)/**'
              - '.github/workflows/ccip-integration-test.yml'

  resolve-chainlink-ref:
    name: Resolve Chainlink ref
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e_should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core-ref: ${{ steps.refs.outputs.core-ref || steps.merge-ref.outputs.core-ref || steps.default-ref.outputs.core-ref }}
    steps:
      - name: Resolve and verify PR body refs
        id: refs
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: smartcontractkit/.github/actions/get-refs-from-pr-body@get-refs-from-pr-body/v1
        with:
          sigscanner-url: ${{ secrets.SIGSCANNER_URL }}
          sigscanner-api-key: ${{ secrets.SIGSCANNER_API_KEY }}
      - name: Resolve and verify merge-group PR body core ref
        id: merge-ref
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          SIGSCANNER_URL: ${{ secrets.SIGSCANNER_URL }}
          SIGSCANNER_API_KEY: ${{ secrets.SIGSCANNER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$MERGE_GROUP_HEAD_REF" =~ pr-([0-9]+)-[a-fA-F0-9]+ ]]; then
            echo "::error::Could not determine the PR number from merge-group ref: $MERGE_GROUP_HEAD_REF"
            exit 1
          fi
          pr_number="${BASH_REMATCH[1]}"
          pr_body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.body // ""')"
          # The pre-merge-queue workflow accepted full commit SHAs only. Keep
          # that contract here, but verify the SHA before it reaches checkout.
          core_ref="$(printf '%s\n' "$pr_body" | grep -ioE 'core ref:[[:space:]]*[a-f0-9]{40}' | awk '{print $NF}' | head -n 1 || true)"
          if [ -z "$core_ref" ]; then
            echo "core-ref=develop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          core_ref="$(printf '%s' "$core_ref" | tr '[:upper:]' '[:lower:]')"
          verification="$(curl -fsS --max-time 300 --get "$SIGSCANNER_URL" \
            --data-urlencode "commit=${core_ref}" \
            --data-urlencode "repository=smartcontractkit/chainlink" \
            --data-urlencode "disable_gpg=true" \
            -H "X-SIGSCANNER-SECRET: ${SIGSCANNER_API_KEY}")"
          if [ "$(printf '%s' "$verification" | jq -r '.verified == true')" != "true" ]; then
            echo "::error::SigScanner did not verify Chainlink commit $core_ref"
            exit 1
          fi
          echo "core-ref=$core_ref" >> "$GITHUB_OUTPUT"
      - name: Use the trusted default for fork pull requests
        id: default-ref
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "core-ref=develop" | tee -a "$GITHUB_OUTPUT"

  integration-test-matrix:
    needs: [changes, resolve-chainlink-ref]
    if: ${{ needs.changes.outputs.e2e_should_run == 'true' }}
    env:
      # We explicitly have this env var not be "CL_DATABASE_URL" to avoid having it be used by core related tests
      # when they should not be using it, while still allowing us to DRY up the setup
      DB_URL: postgresql://postgres:postgres@localhost:5432/chainlink_test?sslmode=disable

    strategy:
      fail-fast: false
      matrix:
        type:
          - name: "Fees Test"
            run: "Test_CCIPFees"
            timeout: 12m
          - name: "Token Transfer Test"
            run: "TestTokenTransfer_EVM2EVM"
            timeout: 12m
          - name: "USDC Test"
            run: "TestUSDCTokenTransfer"
            timeout: 12m
          - name: "OOO Execution Test"
            run: "Test_OutOfOrderExecution"
            timeout: 12m
          - name: "Messaging Test Test_CCIPMessaging_EVM2EVM"
            run: "^Test_CCIPMessaging_EVM2EVM$"
            timeout: 20m
          - name: "Messaging Test Test_CCIPMessaging_EVM2Solana"
            run: "^Test_CCIPMessaging_EVM2Solana$"
            timeout: 30m
            installLoopPlugins: "solana"
          - name: "Messaging Test Test_CCIPMessaging_Solana2EVM"
            run: "^Test_CCIPMessaging_Solana2EVM$"
            timeout: 30m
            installLoopPlugins: "solana"
          - name: "Messaging Test Test_CCIPMessaging_MultiExecReports_EVM2Solana"
            run: "^Test_CCIPMessaging_MultiExecReports_EVM2Solana$"
            timeout: 35m
            installLoopPlugins: "solana"
          - name: "Batching Test Test_CCIPBatching_MaxBatchSizeEVM"
            run: "Test_CCIPBatching_MaxBatchSizeEVM"
            timeout: 12m
          - name: "Batching Test Test_CCIPBatching_MultiSource"
            run: "^Test_CCIPBatching_MultiSource$"
            timeout: 12m
          - name: "Batching Test Test_CCIPBatching_MultiSource_MultiRoot"
            run: "Test_CCIPBatching_MultiSource_MultiRoot"
            timeout: 12m
          - name: "Batching Test Test_CCIPBatching_SingleSource"
            run: "^Test_CCIPBatching_SingleSource$"
            timeout: 12m
          - name: "Batching Test Test_CCIPBatching_SingleSource_MultiRoot"
            run: "Test_CCIPBatching_SingleSource_MultiRoot"
            timeout: 12m
          - name: "Gas Price Updates Test"
            run: "Test_CCIPGasPriceUpdates"
            timeout: 12m
          # TODO: this can only run in docker for now, switch to in-memory and uncomment
          # - name: "Token Price Updates Test"
          #   run: "Test_CCIPTokenPriceUpdates"
          #   timeout: 12m
          - name: "CCIPReader Test"
            run: "TestCCIPReader|Test_GetChainFeePriceUpdates|Test_GetWrappedNativeTokenPriceUSD"
            timeout: 12m
            go_parallel: 1
          - name: "Test_CCIPTopologies_EVM2EVM_RoleDON_AllSupportSource_SomeSupportDest"
            run: "^Test_CCIPTopologies_EVM2EVM_RoleDON_AllSupportSource_SomeSupportDest$"
            timeout: 20m

    name: Integration Tests (${{ matrix.type.name }})
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: smartcontractkit/.github/actions/free-disk-space@free-disk-space/v1
      - name: Checkout the chainlink-ccip repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Clone Chainlink repo
        uses: actions/checkout@v7
        with:
          repository: smartcontractkit/chainlink
          ref: ${{ needs.resolve-chainlink-ref.outputs.core-ref }}
          path: chainlink
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Use the Chainlink clone's go.mod: setup-go v6+ exports GOTOOLCHAIN=local,
          # so the installed toolchain must already satisfy Chainlink's go directive.
          go-version-file: "chainlink/go.mod"
          cache-dependency-path: "**/go.sum"
      - name: Display Go version
        run: go version
      - name: Get the correct chainlink-ccip commit SHA via GitHub API
        id: get_sha
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" == "merge_group" ]; then
            COMMIT_SHA="${{ github.event.merge_group.head_sha }}"
          else
            COMMIT_SHA=$(curl -fsS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.ref }}" | jq -r .sha)
          fi
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Update chainlink-ccip dependency in chainlink
        run: |
          export GOPRIVATE="github.com/smartcontractkit/chainlink-ccip"
          ccip_sha="${{ steps.get_sha.outputs.sha }}"
          ccip_modules=(
            github.com/smartcontractkit/chainlink-ccip
            github.com/smartcontractkit/chainlink-ccip/chains/evm
            github.com/smartcontractkit/chainlink-ccip/deployment
          )
          update_ccip_modules() {
            for module in "${ccip_modules[@]}"; do
              go get "${module}@${ccip_sha}"
            done
          }

          cd "$GITHUB_WORKSPACE/chainlink"
          update_ccip_modules
          # gomods tidy fetches every module in the Chainlink repo in parallel and
          # occasionally dies on a transient proxy.golang.org stream reset, so retry.
          for i in 1 2 3; do
            make gomodtidy && break
            if [ "$i" -eq 3 ]; then
              echo "make gomodtidy failed after 3 attempts"
              exit 1
            fi
            echo "retry $i - make gomodtidy failed, sleeping 10s"
            sleep 10
          done

          cd "$GITHUB_WORKSPACE/chainlink/integration-tests"
          update_ccip_modules
          go mod tidy
      - name: Setup Postgres
        uses: ./.github/actions/setup-postgres
      - name: Download Go vendor packages
        run: |
          cd "$GITHUB_WORKSPACE/chainlink"
          go mod download
          cd "$GITHUB_WORKSPACE/chainlink/integration-tests"
          go mod download
      - name: Build binary
        run: |
          cd "$GITHUB_WORKSPACE/chainlink"
          go build -o ccip.test .
      - name: Get LOOP plugin info
        if: matrix.type.installLoopPlugins
        id: loop_plugin_ref
        run: |
          plugin='${{ matrix.type.installLoopPlugins }}'
          file=$GITHUB_WORKSPACE/chainlink/plugins/plugins.public.yaml
          ref=$(yq ".plugins.${plugin}[0].gitRef" "$file")
          binary=$(basename "$(yq ".plugins.${plugin}[0].installPath" "$file")")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: Cache LOOP plugin binary
        if: matrix.type.installLoopPlugins
        id: cache_loop_plugin
        uses: actions/cache@v6
        with:
          path: ~/go/bin/${{ steps.loop_plugin_ref.outputs.binary }}
          key: ${{ runner.os }}-loop-plugin-${{ matrix.type.installLoopPlugins }}-${{ steps.loop_plugin_ref.outputs.ref }}
      - name: Install LOOP plugins
        if: matrix.type.installLoopPlugins && steps.cache_loop_plugin.outputs.cache-hit != 'true'
        run: |
          yq -i '.plugins = {"${{ matrix.type.installLoopPlugins }}": .plugins.${{ matrix.type.installLoopPlugins }}}' "$GITHUB_WORKSPACE/chainlink/plugins/plugins.public.yaml"
          cd "$GITHUB_WORKSPACE/chainlink"
          make install-plugins-public
      - name: Setup DB
        shell: bash
        run: |
          go -C "$GITHUB_WORKSPACE/chainlink" run ./core/store/cmd/preparetest
        env:
          CL_DATABASE_URL: ${{ env.DB_URL }}
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: ${{ matrix.type.name }}
        id: run-tests
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE/chainlink/integration-tests/smoke/ccip"
          run="${{ matrix.type.run }}"
          if ! go test -list "$run" . | grep -q '^Test'; then
            echo "No tests matched -run '$run'"
            exit 1
          fi
          parallel_flag=""
          if [ -n "${{ matrix.type.go_parallel }}" ]; then
            parallel_flag="-parallel=${{ matrix.type.go_parallel }}"
          fi
          echo "gotestsum --junitfile=test-results.xml --format=github-actions -- . -timeout ${{ matrix.type.timeout }} ${parallel_flag} -run '${run}'"
          gotestsum --junitfile=test-results.xml --format=github-actions -- . -timeout ${{ matrix.type.timeout }} ${parallel_flag} -run "$run"
        env:
          CL_DATABASE_URL: ${{ env.DB_URL }}

      - name: Prepare test result artifact
        id: prepare-results
        if: always() && (steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure')
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run-tests.outcome }}
          TEST_JOB_URL: ${{ format('https://github.com/{0}/actions/runs/{1}/job/{2}/attempts/{3}', github.repository, github.run_id, job.check_run_id, github.run_attempt) }}
          TEST_RESULTS_DIR: ${{ github.workspace }}/chainlink/integration-tests/smoke/ccip
        run: |
          if [ ! -f "$TEST_RESULTS_DIR/test-results.xml" ]; then
            echo "::error::The test step finished without producing a JUnit report."
            exit 1
          fi
          printf '%s\n' "$TEST_OUTCOME" > "$TEST_RESULTS_DIR/test-outcome.txt"
          printf '%s\n' "$TEST_JOB_URL" > "$TEST_RESULTS_DIR/test-job-url.txt"
      - name: Upload test result artifact
        id: upload-results
        if: always() && steps.prepare-results.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ccip-integration-test-results-${{ strategy.job-index }}
          path: |
            ${{ github.workspace }}/chainlink/integration-tests/smoke/ccip/test-results.xml
            ${{ github.workspace }}/chainlink/integration-tests/smoke/ccip/test-outcome.txt
            ${{ github.workspace }}/chainlink/integration-tests/smoke/ccip/test-job-url.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  upload-test-results:
    name: Upload Test Results (${{ matrix.type.name }})
    needs: [integration-test-matrix, resolve-chainlink-ref]
    if: always() && needs.integration-test-matrix.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The upload action reads PR metadata with the default token.
      pull-requests: read
    strategy:
      fail-fast: false
      # Keep names and order aligned with integration-test-matrix; job-index links each result artifact.
      matrix:
        type:
          - name: "Fees Test"
          - name: "Token Transfer Test"
          - name: "USDC Test"
          - name: "OOO Execution Test"
          - name: "Messaging Test Test_CCIPMessaging_EVM2EVM"
          - name: "Messaging Test Test_CCIPMessaging_EVM2Solana"
          - name: "Messaging Test Test_CCIPMessaging_Solana2EVM"
          - name: "Messaging Test Test_CCIPMessaging_MultiExecReports_EVM2Solana"
          - name: "Batching Test Test_CCIPBatching_MaxBatchSizeEVM"
          - name: "Batching Test Test_CCIPBatching_MultiSource"
          - name: "Batching Test Test_CCIPBatching_MultiSource_MultiRoot"
          - name: "Batching Test Test_CCIPBatching_SingleSource"
          - name: "Batching Test Test_CCIPBatching_SingleSource_MultiRoot"
          - name: "Gas Price Updates Test"
          - name: "CCIPReader Test"
          - name: "Test_CCIPTopologies_EVM2EVM_RoleDON_AllSupportSource_SomeSupportDest"
    steps:
      - name: Checkout Chainlink test sources
        uses: actions/checkout@v7
        with:
          repository: smartcontractkit/chainlink
          ref: ${{ needs.resolve-chainlink-ref.outputs.core-ref }}
          path: chainlink
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The upload action shells out to junit-enhancer, which `go install`
          # writes to $GOPATH/bin. Only setup-go puts that directory on PATH.
          go-version-file: chainlink/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Download test result artifact
        id: download-results
        uses: actions/download-artifact@v8
        with:
          name: ccip-integration-test-results-${{ strategy.job-index }}
          path: test-results
      - name: Read test outcome
        id: test-results
        if: steps.download-results.outcome == 'success'
        shell: bash
        run: |
          outcome="$(cat test-results/test-outcome.txt)"
          if [[ "$outcome" != "success" && "$outcome" != "failure" ]]; then
            echo "::error::Invalid test outcome in result artifact."
            exit 1
          fi
          test_job_url="$(cat test-results/test-job-url.txt)"
          expected_job_url_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/"
          test_job_url_suffix="${test_job_url#"$expected_job_url_prefix"}"
          if [[ "$test_job_url" != "$expected_job_url_prefix"* || ! "$test_job_url_suffix" =~ ^[0-9]+/attempts/[0-9]+$ ]]; then
            echo "::error::Invalid test job URL in result artifact."
            exit 1
          fi
          echo "outcome=$outcome" | tee -a "$GITHUB_OUTPUT"
          echo "test-job-url=$test_job_url" | tee -a "$GITHUB_OUTPUT"
      - name: Analyze and upload test results
        if: steps.test-results.outcome == 'success'
        uses: smartcontractkit/.github/actions/branch-out-upload@branch-out-upload/v1
        with:
          junit-file-path: ${{ github.workspace }}/test-results/test-results.xml
          trunk-org-slug: chainlink
          trunk-previous-step-outcome: ${{ steps.test-results.outputs.outcome }}
          trunk-token: ${{ secrets.TRUNK_API_KEY }}
          trunk-job-url: ${{ steps.test-results.outputs.test-job-url }}
          artifact-name: ccip-integration-test-logs-${{ strategy.job-index }}-${{ github.run_attempt }}

  integration-test-ccip-ocr3:
    if: always()
    runs-on: ubuntu-latest
    needs: [integration-test-matrix]
    steps:
      - name: Fail the job if ccip tests in PR not successful
        if: always() && needs.integration-test-matrix.result == 'failure'
        run: exit 0 # TODO: fix the ccip tests and remove this line to make the job fail when ccip tests fail
