[workspace]
resolver = "2"
members = [
  "programs/*",
  "crates/*",
]

# Selects the pinned build image of solana-verify. Keep it equal to the image tag in
# scripts/verify_build.sh and to SBF_BUILD_IMAGE in ../Makefile.
[workspace.metadata.cli]
solana = "4.3.0"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.test]
overflow-checks = true
